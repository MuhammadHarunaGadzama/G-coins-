<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - G-Coins</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<div class="logo">🪙</div>

<h1>Create Account</h1>

<p class="subtitle">
Join G-Coins and start mining today.
</p>

<input
type="text"
id="fullname"
placeholder="Full Name"
required>

<input
type="email"
id="email"
placeholder="Email Address"
required>

<input
type="text"
id="username"
placeholder="Username"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<input
type="text"
id="referral"
placeholder="Referral Code (Optional)">

<button class="btn" onclick="signup()">
Create Account
</button>

<a href="index.html">
<button class="btn2">
Back to Login
</button>
</a>

</div>

<script src="script.js"></script>

</body>
</html>
